apiVersion: apps/v1
kind: Deployment
metadata:
  name: sahil-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sahil-app

  template:
    metadata:
      labels:
        app: sahil-app

    spec:
      containers:
      - name: sahil-app
        image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/sahil-app:latest
        ports:
        - containerPort: 5000
